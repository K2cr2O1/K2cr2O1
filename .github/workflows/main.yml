# Visit https://github.com/lowlighter/metrics#-documentation for full reference
name: Metrics
on:
  # 每 6 小时自动更新一次
  schedule: [{cron: "0 */6 * * *"}]
  # 支持手动触发和代码推送时触发
  workflow_dispatch:
  push: {branches: ["master", "main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 第一步：生成左侧统计图（包含基础信息、核心语言分析、精选仓库）
      - uses: lowlighter/metrics@master
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: left.svg
          user: K2cr2O1
          template: classic
          base: header, activity, community, repositories
          config_timezone: Asia/Shanghai

          # 语言分析：侧重展示 Go 和 Rust，忽略 HTML/CSS 等干扰项
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_languages_ignored: html, css, scss, tex

          # 仓库展示：突出你的重点项目 Neobot 和 Touhou-translate
          plugin_repositories: yes
          plugin_repositories_featured: Fairy-Oracle-Sanctuary/Touhou-translate, K2cr2O1/Neobot

      # 第二步：生成右侧统计图（贡献日历）
      - uses: lowlighter/metrics@master
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: right.svg
          user: K2cr2O1
          base: ""
          config_timezone: Asia/Shanghai

          # 半年贡献日历（等距投影，替代已坏的 activity/achievements/leetcode）
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

      # 第三步：贪吃蛇动画（吃掉贡献格子）
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: K2cr2O1
          outputs: |
            dist/snake.svg?palette=github-dark
      - name: Push snake.svg to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}
